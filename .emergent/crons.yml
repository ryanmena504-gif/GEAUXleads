crons:
  - name: morning-brief
    description: "Sends Ryan the daily morning brief at 7:00 America/Chicago"
    cron: "0 7 * * *"
    timezone: "America/Chicago"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/morning-brief"
    method: POST
    enabled: true
